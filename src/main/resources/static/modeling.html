<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本体建模 · 文档 → T-Box + A-Box · Ollama / OpenAI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="/" style="text-decoration:none;color:inherit">
    <div class="brand-logo">🧩</div>
    <div class="brand-text">
      <h1>本体建模</h1>
      <p>源文档 → AI/规则抽取 → 本体定义（T-Box）+ 本体实例（A-Box）→ 载入推理系统</p>
    </div>
  </a>
  <div class="topbar-right">
    <span class="health" id="ai-health"><i class="dot"></i><span id="ai-health-text">检测 AI…</span></span>
    <a class="btn btn-ghost" href="/">← 推理工作台</a>
    <button class="btn btn-primary" id="btn-one-click" title="创建项目、抽取、生成并载入推理系统">🚀 一键生成并载入</button>
  </div>
</header>

<main class="modeling-layout">
  <aside class="modeling-side">
    <section class="card">
      <div class="card-head">
        <h3>1. 源文档</h3>
        <button class="btn btn-ghost btn-xs" id="btn-sample">载入示例</button>
      </div>
      <label class="field">项目名称
        <input class="input" id="project-name" placeholder="例如：示例合同法" maxlength="200">
      </label>
      <label class="field">粘贴文档内容
        <textarea class="code-editor modeling-source" id="source-text" spellcheck="false"
                  placeholder="粘贴法律条文、设备操作手册、书籍章节等文本…"></textarea>
      </label>
      <label class="field">或上传文件（txt / md / html / pdf / docx）
        <input class="input" type="file" id="source-file"
               accept=".txt,.md,.markdown,.html,.htm,.pdf,.docx,text/plain,text/markdown,text/html,application/pdf">
      </label>
      <p class="muted small" id="file-hint">未选择文件。若选择文件，将优先使用上传文件；PDF/DOCX 由服务端解析。</p>
    </section>

    <section class="card">
      <h3>2. AI 模型（可配置）</h3>
      <label class="field">Provider
        <select class="input" id="ai-provider">
          <option value="ollama">Ollama（本地）</option>
          <option value="openai">OpenAI 兼容 API</option>
          <option value="heuristic">本地规则（无需 AI）</option>
          <option value="mock">Mock（测试）</option>
        </select>
      </label>
      <label class="field">Base URL
        <input class="input" id="ai-base" placeholder="http://127.0.0.1:11434">
      </label>
      <label class="field">模型名称
        <input class="input" id="ai-model" list="ai-models" placeholder="qwen2.5:7b">
        <datalist id="ai-models"></datalist>
      </label>
      <label class="field">Temperature
        <input class="input" id="ai-temperature" type="number" min="0" max="2" step="0.1" value="0.2">
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="ai-fallback" checked>
        <span>AI 调用失败时回退到本地规则抽取</span>
      </label>
      <p class="muted small" id="ai-status-text">正在检测 AI 服务…</p>
    </section>

    <section class="card">
      <div class="card-head">
        <h3>3. 历史项目</h3>
        <button class="btn btn-ghost btn-xs" id="btn-refresh-projects">刷新</button>
      </div>
      <div class="modeling-project-list" id="project-list">
        <div class="placeholder small">加载中…</div>
      </div>
    </section>
  </aside>

  <section class="modeling-main">
    <section class="card">
      <div class="model-title">
        <div>
          <h2 id="project-title">尚未创建项目</h2>
          <p class="muted" id="project-meta">填写左侧内容，点击「创建项目」或直接「一键生成并载入」。</p>
        </div>
        <div class="chips">
          <span class="chip" id="status-chip">-</span>
          <span class="chip chip-ghost" id="ai-chip">-</span>
        </div>
      </div>
      <div class="wizard-actions">
        <button class="btn btn-secondary" id="btn-create">① 创建项目</button>
        <button class="btn btn-secondary" id="btn-extract">② 抽取候选</button>
        <button class="btn btn-secondary" id="btn-generate">③ 生成 T-Box / A-Box</button>
        <button class="btn btn-primary" id="btn-load">④ 载入推理系统</button>
      </div>
      <div class="wizard-steps" id="modeling-steps">
        <div class="wizard-step" data-rank="0"><b>1</b> 文档</div>
        <div class="wizard-step" data-rank="1"><b>2</b> 抽取</div>
        <div class="wizard-step" data-rank="2"><b>3</b> 生成本体</div>
        <div class="wizard-step" data-rank="3"><b>4</b> 载入推理</div>
      </div>
    </section>

    <section class="warnings" id="modeling-warnings" hidden></section>
    <section class="stat-grid" id="modeling-stats"></section>

    <section class="card">
      <div class="card-head">
        <h3>生成结果</h3>
        <div class="row preview-tabs">
          <button class="btn btn-ghost btn-xs preview-tab active" data-preview="ontology">T-Box 本体定义</button>
          <button class="btn btn-ghost btn-xs preview-tab" data-preview="instances">A-Box 本体实例</button>
          <button class="btn btn-ghost btn-xs preview-tab" data-preview="extraction">抽取 JSON</button>
          <button class="btn btn-ghost btn-xs" id="btn-refresh-preview">刷新</button>
        </div>
      </div>
      <pre class="preview" id="preview-body"><span class="placeholder">创建项目并完成抽取/生成后，这里显示生成的 Turtle 文档。</span></pre>
    </section>

    <section class="card success-card" id="load-success" hidden>
      <div class="card-head">
        <h3>✅ 已载入推理系统</h3>
        <span class="chip state-reasoned" id="load-model-chip">-</span>
      </div>
      <p class="muted" id="load-success-detail"></p>
      <div class="row" style="margin-top:12px">
        <a class="btn btn-primary" id="open-workspace" href="/">打开推理工作台 →</a>
        <button class="btn btn-ghost" id="btn-copy-model">复制模型 ID</button>
      </div>
    </section>
  </section>
</main>

<div class="toasts" id="toasts"></div>
<script src="/js/modeling.js"></script>
</body>
</html>
