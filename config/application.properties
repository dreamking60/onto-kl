# ============================================================================
#  Optional external overrides for the Ontology Reasoning Server.
#
#  Spring Boot automatically loads ./config/application.properties when the
#  application is started from the project root (IDEA's working directory is
#  normally the project root as well).  Values here override
#  src/main/resources/application.yml.
#
#  For a TDSQL instance replace host / port / database / account below, or use
#  environment variables (recommended for passwords):
#      APP_DATASOURCE_TDSQL_URL
#      APP_DATASOURCE_TDSQL_USERNAME
#      APP_DATASOURCE_TDSQL_PASSWORD
# ============================================================================

# Default data source profile: tdsql | h2
app.default-profile=tdsql

# TDSQL (MySQL wire protocol)
app.datasource.tdsql.driver=com.mysql.cj.jdbc.Driver
app.datasource.tdsql.url=jdbc:mysql://127.0.0.1:3306/ontology_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
app.datasource.tdsql.username=ontology
app.datasource.tdsql.password=ontology123

# ---------------------------------------------------------------------------
#  Document-driven ontology modeling (optional overrides)
# ---------------------------------------------------------------------------
# AI provider: ollama | openai | heuristic | mock
app.modeling.ai.provider=ollama
app.modeling.ai.base-url=http://127.0.0.1:11434
app.modeling.ai.model=qwen2.5:7b
# For OpenAI-compatible endpoints set base-url/model above and put the key here
# or (recommended) export APP_MODELING_AI_API_KEY=...
#app.modeling.ai.api-key=
app.modeling.ai.timeout-seconds=180
app.modeling.ai.temperature=0.2
app.modeling.ai.fallback-to-heuristic=true
